name: Publish Changed Mods

permissions:
  contents: read

on:
  push:
    branches:
      - main

env:
  API_BASE: https://api.nexusmods.com/v3
  GAME_DOMAIN: warhammer40kdarktide

jobs:
  get-changed-mods:
    name: Get changed mods
    runs-on: ubuntu-latest
    outputs:
      # only modified cuz new mods need to be setup & uploaded on Nexus before CI/CD
      modified_info: ${{ steps.changed-mods.outputs.modified_files }}
      modified_count: ${{ steps.changed-mods.outputs.modified_files_count }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Get changed mods
        id: changed-mods
        uses: tj-actions/changed-files@v47.0.6
        with:
          files: |
            */info.json
          matrix: true

  publish-mods-matrix:
    name: Publish updated mods
    runs-on: ubuntu-latest
    needs: [get-changed-mods]
    if: needs.get-changed-mods.outputs.modified_count > 0
    strategy:
      matrix:
        mod: ${{ fromJSON(needs.get-changed-mods.outputs.modified_info) }}
      max-parallel: 4
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Get mod info
        id: mod-info
        run: |
          echo "metadata=$(jq -c . < ${{ matrix.mod }})" >> $GITHUB_OUTPUT
          echo "dir=$(dirname ${{ matrix.mod }})" >> $GITHUB_OUTPUT
      - name: Fetch mod ident
        id: mod-ident
        run: |
          scopedId=$(basename ${{ fromJSON(steps.mod-info.outputs.metadata).homepage }})
          echo "scopedId=$scopedId" >> $GITHUB_OUTPUT
          modId=$(curl -s "$API_BASE/games/$GAME_DOMAIN/mods/$scopedId"\
            -H "apikey:${{ secrets.NEXUSMODS_API_KEY }}"\
            | jq -r ".data.id")
          echo "modId=$modId" >> $GITHUB_OUTPUT
          fileId=$(curl -s "$API_BASE/mods/$modId/files/"\
            -H "apikey:${{ secrets.NEXUSMODS_API_KEY }}"\
            | jq -r ".data.mod_files[0].id")
          echo "fileId=$fileId" >> $GITHUB_OUTPUT
      - name: Zip files
        run: zip -r ${{ steps.mod-info.outputs.dir }}.zip ${{ steps.mod-info.outputs.dir }}/
      - name: Upload to NexusMods
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ steps.mod-ident.outputs.fileId }}
          filename: ${{ steps.mod-info.outputs.dir }}.zip
          display_name: ${{ steps.mod-info.outputs.dir }}
          version: ${{ fromJSON(steps.mod-info.outputs.metadata).version }}
          update_mod_version: true
